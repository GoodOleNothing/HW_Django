<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
            <nav class="ms-5">
                <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home'%}">Домашняя странциа</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts'%}">Контакты</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list'%}">Каталог</a>
            </nav>
            <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
                {% if user.is_authenticated %}
                <form action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="btn me-3 py-2 link-body-emphasis text-decoration-none" type="submit">Выход</button>
                </form>
                {% else %}
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:register' %}">Регистрация</a>
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:login' %}">Вход</a>
                {% endif %}
            </nav>
    </div>
</header>
