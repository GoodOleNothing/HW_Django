<header>
    <span class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-gray border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Messanger</h5>
            <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
                {% if user.is_authenticated %}
                <form action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    <span>{{ user.email }}</span>
                    <button class="btn me-3 py-2 link-body-emphasis text-decoration-none" type="submit">Выход</button>
                </form>
                {% else %}
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:register' %}">Регистрация</a>
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:login' %}">Вход</a>
                {% endif %}
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:password_reset' %}">Сбросить пароль</a>
            </nav>
    </span>
        <div class="nav-scroller py-1 mb-3 border-bottom">
            <nav class="nav nav-underline justify-content-center">
                <a class="nav-item nav-link link-body-emphasis" href="{% url 'messanger:message_create' %}">Создать сообщение</a>
                <a class="nav-item nav-link link-body-emphasis" href="{% url 'messanger:mailing_create' %}">Создать рассылку</a>
                <a class="nav-item nav-link link-body-emphasis" href="{% url 'messanger:recipient_create' %}">Создать получаетеля</a>
            </nav>
        </div>
</header>
